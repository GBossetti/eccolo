<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f0f3bd"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#05668d"/>

  <!-- Bottom strip -->
  <rect x="0" y="582" width="1200" height="48" fill="#05668d"/>

  <!-- Decorative circles — right side -->
  <circle cx="1050" cy="290" r="180" fill="#02c39a" opacity="0.08"/>
  <circle cx="1050" cy="290" r="110" fill="#02c39a" opacity="0.10"/>
  <circle cx="1050" cy="290" r="50"  fill="#028090" opacity="0.18"/>

  <!-- ECCOLO wordmark -->
  <text x="96" y="290"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="800" font-size="148" letter-spacing="-4"
        fill="#05668d">ECCOLO</text>

  <!-- Tagline -->
  <text x="100" y="370"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="300" font-size="34" letter-spacing="1"
        fill="#028090">Custom Software · Web Presence · AI Solutions</text>

  <!-- Divider line -->
  <rect x="100" y="410" width="560" height="2" fill="#05668d" opacity="0.2"/>

  <!-- Sub-descriptor -->
  <text x="100" y="450"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="400" font-size="22"
        fill="#05668d" opacity="0.7">Built around the way you actually work.</text>

  <!-- URL in bottom bar -->
  <text x="100" y="616"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="500" font-size="22" letter-spacing="1"
        fill="#f0f3bd">eccolosolutions.com</text>

  <!-- Right label in bottom bar -->
  <text x="1100" y="616"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="300" font-size="18"
        fill="#f0f3bd" opacity="0.7" text-anchor="end">design@eccolo.com</text>
</svg>
